name: tui-pty

on:
  workflow_dispatch:
  pull_request:

jobs:
  tui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tui]" pytest

      - name: Run TUI test suite (PTY lane)
        env:
          TERM: xterm-256color
        run: |
          timeout 420 python -m pytest tests/test_tui*.py -q --tb=short
